<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>your LLM here</title>
<style>
  :root {
    color-scheme: dark;
    --ink: #e8e4dc;
    --muted: #8d887e;
    --line: rgba(232, 228, 220, 0.14);
    --paper: #0c0d10;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }
  header {
    width: min(720px, calc(100% - 48px));
    padding: 28px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  header span { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    width: min(720px, calc(100% - 48px));
    gap: 28px;
    padding: 24px 0 48px;
  }
  h1 {
    margin: 0;
    font-weight: 500;
    font-size: clamp(40px, 7vw, 72px);
    letter-spacing: -0.03em;
    line-height: 0.95;
  }
  #stage { position: relative; width: min(420px, 78vw); height: min(420px, 78vw); }
  canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
  #caption {
    min-height: 3.2em;
    width: 100%;
    text-align: center;
    font-size: 20px;
    line-height: 1.45;
    color: var(--ink);
  }
  #caption:empty::before { content: "tap the orb, then speak"; color: var(--muted); font-style: italic; }
  form {
    width: 100%;
    display: flex;
    gap: 10px;
    border-top: 1px solid var(--line);
    padding-top: 18px;
  }
  input {
    flex: 1;
    background: transparent;
    border: 0;
    color: var(--ink);
    font: inherit;
    font-size: 18px;
    outline: none;
  }
  input::placeholder { color: var(--muted); }
  button {
    background: transparent;
    color: var(--ink);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 18px;
    font-family: ui-sans-serif, system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    cursor: pointer;
  }
  button:hover { border-color: var(--ink); }
  #note { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12px; color: var(--muted); min-height: 1em; }
</style>
</head>
<body>
<header><span>room</span><span id="state">idle</span></header>
<main>
  <h1>your LLM here</h1>
  <div id="stage"><canvas id="orb" width="840" height="840"></canvas></div>
  <p id="caption"></p>
  <form id="say">
    <input id="text" autocomplete="off" placeholder="type, then hear it">
    <button type="submit">speak</button>
  </form>
  <div id="note"></div>
</main>
<script>
const canvas = document.getElementById('orb');
const ctx = canvas.getContext('2d');
const caption = document.getElementById('caption');
const stateEl = document.getElementById('state');
const note = document.getElementById('note');
const W = canvas.width, H = canvas.height, CX = W / 2, CY = H / 2;

let level = 0;
let target = 0.04;
let speaking = false;
let hearing = false;
const N = 5;
const blobs = Array.from({ length: N }, (_, i) => ({
  hue: 24 + i * 6,
  rx: 248 - i * 14,
  ry: 262 - i * 16,
  speed: 0.11 + i * 0.035,
  phase: i * 1.7,
  ox: Math.cos(i * 2.2) * 14,
  oy: Math.sin(i * 2.2) * 12
}));

function draw(t) {
  const s = t / 1000;
  level += (target - level) * 0.08;
  ctx.clearRect(0, 0, W, H);
  ctx.save();
  ctx.translate(CX, CY);
  ctx.globalCompositeOperation = 'lighter';
  blobs.forEach((b, i) => {
    const breathe = 1 + level * 0.55 + Math.sin(s * b.speed + b.phase) * 0.045;
    const wobble = 1 + Math.sin(s * (0.7 + i * 0.11)) * 0.03;
    ctx.save();
    ctx.rotate(Math.sin(s * 0.12 + i) * 0.35);
    ctx.translate(Math.cos(s * b.speed) * b.ox, Math.sin(s * b.speed * 0.8) * b.oy);
    ctx.scale(breathe * wobble, breathe / wobble);
    const g = ctx.createRadialGradient(-b.rx * 0.1, -b.ry * 0.14, b.rx * 0.02, 0, 0, b.rx);
    g.addColorStop(0, `hsla(${b.hue}, 35%, 94%, 0.92)`);
    g.addColorStop(0.22, `hsla(${b.hue + 3}, 50%, 74%, 0.7)`);
    g.addColorStop(0.5, `hsla(${b.hue + 6}, 52%, 52%, 0.34)`);
    g.addColorStop(0.78, `hsla(${b.hue + 8}, 46%, 34%, 0.12)`);
    g.addColorStop(1, `hsla(${b.hue}, 40%, 14%, 0)`);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.ellipse(0, 0, b.rx, b.ry, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });
  ctx.restore();
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

function setState(s) { stateEl.textContent = s; }

const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null;
let wantHear = false;

function startHearing() {
  if (!Rec) { note.textContent = 'this browser has no speech recognition'; return; }
  if (!rec) {
    rec = new Rec();
    rec.continuous = true;
    rec.interimResults = true;
    rec.onresult = (e) => {
      let finalText = '';
      let interim = '';
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const piece = e.results[i][0].transcript;
        if (e.results[i].isFinal) finalText += piece;
        else interim += piece;
      }
      const shown = (finalText || interim).trim();
      if (shown) caption.textContent = shown;
      target = interim ? 0.7 : 0.35;
    };
    rec.onstart = () => { hearing = true; setState('listening'); note.textContent = ''; };
    rec.onend = () => {
      hearing = false;
      if (!speaking) target = 0.04;
      if (wantHear) { try { rec.start(); } catch {} }
      else setState('idle');
    };
    rec.onerror = (e) => {
      if (e.error === 'not-allowed') { wantHear = false; note.textContent = 'microphone blocked'; setState('idle'); }
      else if (e.error !== 'no-speech' && e.error !== 'aborted') note.textContent = e.error;
    };
  }
  wantHear = true;
  try { rec.start(); } catch {}
}

function stopHearing() {
  wantHear = false;
  try { rec && rec.stop(); } catch {}
}

canvas.addEventListener('click', () => { hearing ? stopHearing() : startHearing(); });

document.getElementById('say').addEventListener('submit', (e) => {
  e.preventDefault();
  const text = document.getElementById('text').value.trim();
  if (!text) return;
  if (!window.speechSynthesis) { note.textContent = 'this browser has no speech synthesis'; return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.onstart = () => { speaking = true; target = 0.9; setState('speaking'); caption.textContent = text; };
  u.onend = () => { speaking = false; target = hearing ? 0.35 : 0.04; setState(hearing ? 'listening' : 'idle'); };
  u.onerror = () => { speaking = false; target = 0.04; };
  window.speechSynthesis.speak(u);
  document.getElementById('text').value = '';
});
</script>
</body>
</html>
